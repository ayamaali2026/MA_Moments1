name: ma-moments

topology:
  nodes:
    client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl

    web:
      kind: linux
      image: ma-moments:latest
      ports:
        - "8081:80"

  links:
    - endpoints:
        - "client:eth1"
        - "web:eth1"