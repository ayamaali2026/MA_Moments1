name: ma-moments

topology:
  nodes:
    client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl

    web:
      kind: linux
      image: nginx:alpine
      binds:
        - /home/ma-server/MA_Moments1:/usr/share/nginx/html:ro
      ports:
        - "8081:80"

  links:
    - endpoints:
        - "client:eth1"
        - "web:eth1"